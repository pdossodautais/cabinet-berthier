name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Use pinned npm version
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate .client-config.json
        run: node scripts/validate-client-config.mjs

      - name: Build web
        run: npx turbo build --filter=@repo/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service
          REVALIDATION_SECRET: ci-placeholder-secret
          RESEND_API_KEY: ci-placeholder-resend

      - name: Build admin
        run: npx turbo build --filter=@repo/admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service
          REVALIDATION_SECRET: ci-placeholder-secret
          RESEND_API_KEY: ci-placeholder-resend
